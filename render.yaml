services:
  - type: web
    name: biotoolkit-enterprise
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --worker-class gevent --workers 4 --threads 1 --timeout 120"
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromService:
          type: database
          name: biotoolkit-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: biotoolkit-cache
          property: connectionString
      - key: NCBI_API_KEY
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false

  - type: worker
    name: biotoolkit-worker
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A worker.celery worker --loglevel=info"
    envVars:
      - key: DATABASE_URL
        fromService:
          type: database
          name: biotoolkit-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: biotoolkit-cache
          property: connectionString

  - type: redis
    name: biotoolkit-cache
    ipAllowList: []
    plan: free

databases:
  - name: biotoolkit-db
    databaseName: biotoolkit
    user: biouser
    plan: free
